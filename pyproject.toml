[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "srag-insight-agent"
version = "0.1.0"
description = "Agente de IA Generativa que gera relatórios sobre SRAG a partir do Open DATASUS e de notícias em tempo real."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "feedparser>=6.0",
    "anthropic>=1.0",
    "google-genai>=2.0",
    "langgraph>=0.2",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pypdf>=5"]

[project.scripts]
srag-download = "srag_agent.data.download:main"
srag-etl = "srag_agent.data.etl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
